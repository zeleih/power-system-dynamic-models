[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-system-dynamic-models"
version = "0.2.0"
description = "Auditable, source-traceable dynamic models for power-system studies"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zeleih" }]
keywords = [
  "power systems",
  "dynamic models",
  "ANDES",
  "TGOV5",
  "governor",
  "HVDC",
  "LCC",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]
dependencies = ["andes>=1.9.3,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.urls]
Repository = "https://github.com/zeleih/power-system-dynamic-models"
Issues = "https://github.com/zeleih/power-system-dynamic-models/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
